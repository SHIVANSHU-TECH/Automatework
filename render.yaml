services:
  - type: web
    name: automatework-api
    runtime: node
    rootDir: .
    buildCommand: bash build-api.sh
    startCommand: bash start-api.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: GROQ_API_KEY
        sync: false
      - key: APP_AUTH_SECRET
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
